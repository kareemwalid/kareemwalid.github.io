<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/operator.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230a0b0d'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='18' fill='%23ffa155' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="prompt" href="{{ '/' | relative_url }}">kareem@ops</a>
    <span class="path">:~{{ page.url }}</span>
    <span class="caret">▮</span>
    <span class="spacer"></span>
    <nav class="topnav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>index</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active"{% endif %}>about</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives' %} class="active"{% endif %}>archive</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags' and page.url == '/tags/' %} class="active"{% endif %}>tags</a>
      <a href="{{ '/categories/' | relative_url }}"{% if page.url == '/categories/' %} class="active"{% endif %}>categories</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site">
    <span>© {{ site.social.name | default: 'Kareem Walid' }} · {{ site.time | date: '%Y' }} · written in Cairo</span>
    <span class="kbd">
      <span><kbd>G</kbd> index</span>
      <span><kbd>/</kbd> search</span>
    </span>
  </footer>

  <script>
    (() => {
      document.addEventListener('keydown', (e) => {
        if (e.target.matches('input,textarea')) return;
        if (e.key === 'g' && !e.ctrlKey && !e.metaKey) location.href = '{{ "/" | relative_url }}';
      });
    })();
  </script>
</body>
</html>
