<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/operator.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2307090f'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='700' font-size='15' fill='%2358a6ff' text-anchor='middle'%3E%26gt;_%3C/text%3E%3C/svg%3E">
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a class="nav-logo" href="{{ '/' | relative_url }}">
        <span class="bracket">[</span>kareem<span class="at">@</span>sec<span class="bracket">]</span><span class="cursor-blink">_</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">About</a></li>
        <li><a class="nav-link{% if page.url contains '/archives' %} active{% endif %}" href="{{ '/archives/' | relative_url }}">Archive</a></li>
        <li><a class="nav-link{% if page.url contains '/posts' or page.layout == 'tag' or page.layout == 'category' %} active{% endif %}" href="{{ '/archives/' | relative_url }}">Writeups</a></li>
        <li><a class="nav-link{% if page.url == '/tags/' %} active{% endif %}" href="{{ '/tags/' | relative_url }}">Tags</a></li>
        <li><a class="nav-link{% if page.url contains '/about' %} active{% endif %}" href="{{ '/about/' | relative_url }}">Me</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-section">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site container">
    <span>
      <span class="accent">&gt;_</span>
      &nbsp;&copy; {{ site.social.name | default: 'Kareem Walid' }} · {{ site.time | date: '%Y' }}
      · built with Jekyll in Cairo
    </span>
    <span>
      design inspired by <a href="https://toxkay.github.io/">toxkay.github.io</a>
      · <a href="https://github.com/kareemwalid">GitHub</a>
      · <a href="https://twitter.com/kareemwalid17">X</a>
    </span>
  </footer>

  <script>
    // mobile nav
    const t = document.getElementById('navToggle');
    const l = document.getElementById('navLinks');
    if (t && l) t.addEventListener('click', () => l.classList.toggle('open'));
    // scroll-shadow on nav
    const n = document.getElementById('navbar');
    const onScroll = () => n.classList.toggle('scrolled', window.scrollY > 10);
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
    // 'g' → home
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input,textarea')) return;
      if (e.key === 'g' && !e.ctrlKey && !e.metaKey) location.href = '{{ "/" | relative_url }}';
    });
  </script>
</body>
</html>
