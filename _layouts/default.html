<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/operator.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%230a0a0a'/%3E%3Ctext x='16' y='24' font-family='monospace' font-weight='700' font-size='22' fill='%23ffa500' text-anchor='middle'%3E0x%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">kareem.zine</a>
    <span class="spacer"></span>
    <nav class="topnav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active"{% endif %}>about</a>
      <a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives' %} class="active"{% endif %}>archive</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} class="active"{% endif %}>tags</a>
      <a href="{{ '/categories/' | relative_url }}"{% if page.url == '/categories/' %} class="active"{% endif %}>cats</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site">
    <span>::: <span class="brand">kareem.zine</span> ::: &copy; {{ site.social.name | default: 'Kareem Walid' }} · compiled {{ site.time | date: '%Y-%m-%d' }}</span>
    <span>cairo, eg &nbsp;|&nbsp; <a href="https://github.com/kareemwalid">github</a> &nbsp;|&nbsp; <a href="https://twitter.com/kareemwalid17">x</a></span>
  </footer>

  <script>
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input,textarea')) return;
      if (e.key === 'g' && !e.ctrlKey && !e.metaKey) location.href = '{{ "/" | relative_url }}';
    });
  </script>
</body>
</html>
