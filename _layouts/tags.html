---
layout: default
---
<div class="crumb">
  <span class="amber">kareem.zine</span>
  <span class="sep">::</span>
  <span>tags</span>
</div>

<div class="box">
  <h2>0x00  Tag index</h2>
  <div class="box-sub">All tags across the catalogue, with entry counts.</div>
  <div class="chip-row">
    {% assign tags = site.tags | sort %}
    {% for t in tags %}
    {% assign ts = t[0] | slugify %}
    <a href="{{ ts | prepend: '/tags/' | append: '/' | relative_url }}">
      <span>{{ t[0] | downcase }}</span>
      <span class="count">{{ t[1].size }}</span>
    </a>
    {% endfor %}
  </div>
</div>
