---
layout: default
---
<div class="section-header">
  <span class="section-prefix">// </span>
  <h1 class="section-title">tags</h1>
  <p class="section-sub">Every tag across the catalogue, with entry counts.</p>
</div>

<div class="chip-grid">
  {% assign tags = site.tags | sort %}
  {% for t in tags %}
  {% assign ts = t[0] | slugify %}
  <a href="{{ ts | prepend: '/tags/' | append: '/' | relative_url }}">
    <span>{{ t[0] | downcase }}</span>
    <span class="count">{{ t[1].size }}</span>
  </a>
  {% endfor %}
</div>
