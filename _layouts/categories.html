---
layout: default
---
<div class="section-header">
  <span class="section-prefix">// </span>
  <h1 class="section-title">categories</h1>
  <p class="section-sub">Every category across the catalogue, with entry counts.</p>
</div>

<div class="chip-grid">
  {% assign cats = site.categories | sort %}
  {% for c in cats %}
  {% assign cs = c[0] | slugify %}
  <a href="{{ cs | prepend: '/categories/' | append: '/' | relative_url }}">
    <span>{{ c[0] | downcase }}</span>
    <span class="count">{{ c[1].size }}</span>
  </a>
  {% endfor %}
</div>
